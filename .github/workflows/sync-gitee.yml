name: Sync to Gitee

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gitee-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::warning::GITEE_TOKEN secret 未配置，跳过 Gitee 同步"
            exit 0
          fi
          git config --global user.email "actions@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          # 用 Basic 请求头携带 token，避免把 token 拼进 URL 触发 git "credential url cannot be parsed"
          git remote add gitee "https://gitee.com/pigking0606/wrongSetSingleUser.git"
          AUTH=$(printf '%s:%s' "pigking0606" "$GITEE_TOKEN" | base64 | tr -d '\n')
          git -c "http.extraheader=Authorization: Basic ${AUTH}" push gitee main 2>&1
          echo "Gitee 同步完成"