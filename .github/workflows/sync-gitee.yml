name: Sync to Gitee

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gitee-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::warning::GITEE_TOKEN secret 未配置，跳过 Gitee 同步"
            exit 0
          fi
          git config --global user.email "actions@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          # 把 token 拼进 URL 前先去掉空白/换行：GitHub Secret 若带尾随换行会让 git 报
          # "credential url cannot be parsed"，之前本 step 正是因此失败
          TOKEN=$(printf '%s' "$GITEE_TOKEN" | tr -d '\r\n ')
          git remote add gitee "https://pigking0606:${TOKEN}@gitee.com/pigking0606/wrongSetSingleUser.git"
          git push gitee main 2>&1
          echo "Gitee 同步完成"