name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 117.72.207.156
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            REPO_DIR="/www/wwwroot/wrongset"
            if [ -d "$REPO_DIR/.git" ]; then
              echo "==> discarding local changes (npm may have modified package-lock.json)..."
              cd "$REPO_DIR"
              git checkout -- . 2>/dev/null || true
              echo "==> git pull..."
              git pull origin main
            else
              echo "==> git clone (from Gitee mirror)..."
              git clone https://gitee.com/pigking0606/wrongSetSingleUser.git "$REPO_DIR"
              cd "$REPO_DIR"
            fi

            # Write .env file with credentials (preserve existing, add/update)
            if [ ! -f .env ]; then
              cp .env.local .env 2>/dev/null || touch .env
            fi
            # Update OSS credentials in .env
            sed -i '/^OSS_ACCESS_KEY_ID=/d' .env 2>/dev/null || true
            sed -i '/^OSS_ACCESS_KEY_SECRET=/d' .env 2>/dev/null || true
            echo "OSS_ACCESS_KEY_ID=${{ secrets.OSS_ACCESS_KEY_ID }}" >> .env
            echo "OSS_ACCESS_KEY_SECRET=${{ secrets.OSS_ACCESS_KEY_SECRET }}" >> .env
            # WebHook 部署密钥（Gitee WebHook 验证用，可选）
            if [ -n "${{ secrets.DEPLOY_WEBHOOK_SECRET }}" ]; then
              sed -i '/^DEPLOY_WEBHOOK_SECRET=/d' .env 2>/dev/null || true
              echo "DEPLOY_WEBHOOK_SECRET=${{ secrets.DEPLOY_WEBHOOK_SECRET }}" >> .env
            fi
            # GitHub PAT（用于部署后同步到 GitHub，可选）
            if [ -n "${{ secrets.GITHUB_PAT }}" ]; then
              sed -i '/^GITHUB_PAT=/d' .env 2>/dev/null || true
              echo "GITHUB_PAT=${{ secrets.GITHUB_PAT }}" >> .env
            fi

            echo "==> deploying webhook script..."
            cp wrong-deploy-webhook.sh /www/wwwroot/wrongset/wrong-deploy-webhook.sh 2>/dev/null || true
            chmod +x /www/wwwroot/wrongset/wrong-deploy-webhook.sh 2>/dev/null || true

            echo "==> running deploy script..."
            bash wrong.sh