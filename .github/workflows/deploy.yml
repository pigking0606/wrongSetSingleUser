name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 117.72.207.156
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            REPO_DIR="/www/wwwroot/wrongset"
            if [ -d "$REPO_DIR/.git" ]; then
              echo "==> git pull..."
              cd "$REPO_DIR"
              git pull origin main
            else
              echo "==> git clone..."
              git clone https://github.com/pigking0606/wrongSetSingleUser.git "$REPO_DIR"
              cd "$REPO_DIR"
            fi

            # Write .env file with OSS credentials (preserve existing, add/update OSS keys)
            if [ ! -f .env ]; then
              cp .env.local .env 2>/dev/null || touch .env
            fi
            # Update OSS credentials in .env
            sed -i '/^OSS_ACCESS_KEY_ID=/d' .env 2>/dev/null || true
            sed -i '/^OSS_ACCESS_KEY_SECRET=/d' .env 2>/dev/null || true
            echo "OSS_ACCESS_KEY_ID=${{ secrets.OSS_ACCESS_KEY_ID }}" >> .env
            echo "OSS_ACCESS_KEY_SECRET=${{ secrets.OSS_ACCESS_KEY_SECRET }}" >> .env

            echo "==> running deploy script..."
            bash wrong.sh